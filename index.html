<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='14' width='88' height='80' rx='14' fill='%237C93E8'/%3E%3Crect x='6' y='14' width='88' height='22' rx='14' fill='%231B2138'/%3E%3Crect x='24' y='6' width='10' height='22' rx='5' fill='%231B2138'/%3E%3Crect x='66' y='6' width='10' height='22' rx='5' fill='%231B2138'/%3E%3Cpath d='M50 84c-14-9-24-18-24-30 0-8 6-13 13-13 5 0 9 3 11 7 2-4 6-7 11-7 7 0 13 5 13 13 0 12-10 21-24 30z' fill='%23FBF7F0'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='14' width='88' height='80' rx='14' fill='%237C93E8'/%3E%3Crect x='6' y='14' width='88' height='22' rx='14' fill='%231B2138'/%3E%3Cpath d='M50 84c-14-9-24-18-24-30 0-8 6-13 13-13 5 0 9 3 11 7 2-4 6-7 11-7 7 0 13 5 13 13 0 12-10 21-24 30z' fill='%23FBF7F0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
 :root{
 --ink: #1B2138;
 --ink-2: #232B49;
 --ink-3: #2C355A;
 --paper: #ede8e3;
 --paper-dim: #cac4bc;
 --text: #e6ddd5;
 --text-dim: #A6ACCB;
 --text-faint: #767CA0;
 --text-ink: #22283B;
 --text-ink-dim: #383036;
 --line: rgba(255,255,255,0.10);
 --line-strong: rgba(255,255,255,0.20);
 --accent: #7C93E8;
 --accent-soft: rgba(124,147,232,0.28);
 --danger: #E2637A;
 --radius-s: 7px;
 --radius-m: 11px;
 --radius-l: 17px;
 }
 *{box-sizing:border-box;}
 html,body{height:100%;}
 body{
 margin:0;
 background:var(--ink);
 color:var(--text);
 font-family:'Ubuntu', sans-serif;
 font-size:19px;
 min-height:100vh;
 -webkit-font-smoothing:antialiased;
 }
 h1,h2,h3,.display{
 font-family:'Ubuntu', sans-serif;
 font-weight:700;
 letter-spacing:-0.01em;
 }
 button{font-family:inherit;}
 .app{
 max-width:1080px;
 margin:0 auto;
 padding:30px 20px 90px;
 }
 .app-header{
 display:flex;
 align-items:baseline;
 justify-content:space-between;
 gap:16px;
 margin-bottom:24px;
 flex-wrap:wrap;
 }
 .app-title{
 font-size:42px;
 margin:0;
 color:var(--paper);
 }
 .who-am-i{
 font-size:16px;
 color:var(--text-dim);
 display:flex;
 align-items:center;
 gap:9px;
 font-weight:500;
 }
 .who-am-i .swatch{
 width:13px;height:13px;border-radius:4px;
 }
 .who-am-i button{
 background:none;border:none;color:var(--text-faint);
 text-decoration:underline;cursor:pointer;font-size:15px;padding:0;
 font-family:inherit;
 }
 .periods-bar{ margin-bottom:24px; }
 .periods-bar .label{
 font-size:12.5px;
 text-transform:uppercase;
 letter-spacing:0.08em;
 color:var(--text-faint);
 margin-bottom:9px;
 font-weight:700;
 }
 .chip-row{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding-bottom:4px;
 }
 .chip{
 background:var(--ink-2);
 border:1.5px solid var(--line);
 border-radius:999px;
 padding:10px 9px 10px 17px;
 display:flex;
 align-items:center;
 gap:10px;
 white-space:nowrap;
 cursor:pointer;
 font-size:15.5px;
 color:var(--text-dim);
 flex:none;
 }
 .chip:hover{border-color:var(--line-strong);}
 .chip.active{
 background:var(--accent-soft);
 border-color:var(--accent);
 color:var(--paper);
 }
 .chip .chip-name{font-weight:700;}
 .chip .chip-meta{font-size:13.5px; color:var(--text-faint);}
 .chip.active .chip-meta{color:var(--text-dim);}
 .chip .edit-pencil{
 background:none;border:none;cursor:pointer;
 color:inherit; opacity:0.6; font-size:14px;
 padding:2px 6px; border-radius:50%;
 }
 .chip .edit-pencil:hover{opacity:1; background:rgba(255,255,255,0.12);}
 .chip-add{
 background:none;
 border:1.5px dashed var(--line-strong);
 color:var(--text-dim);
 font-weight:700;
 }
 .chip-add:hover{border-color:var(--accent); color:var(--paper);}
 .btn{
 border-radius:999px;
 border:1.5px solid var(--line-strong);
 background:transparent;
 color:var(--text);
 padding:11px 18px;
 font-size:15.5px;
 font-weight:700;
 cursor:pointer;
 transition:background .15s ease, border-color .15s ease, transform .1s ease;
 white-space:nowrap;
 }
 .btn:hover{background:rgba(255,255,255,0.06);}
 .btn:active{transform:scale(0.98);}
 .btn-accent{
 background:var(--accent);
 border-color:var(--accent);
 color:#1B2138;
 }
 .btn-accent:hover{background:#8FA3EE;}
 .btn-ghost{border-color:transparent;color:var(--text-dim);}
 .btn-danger{border-color:rgba(226,99,122,0.5); color:var(--danger);}
 .btn-danger:hover{background:rgba(226,99,122,0.1);}
 .btn-sm{padding:7px 13px;font-size:14.5px;}
 .tabs{
 display:flex;
 gap:6px;
 margin-bottom:24px;
 border-bottom:1px solid var(--line);
 }
 .tab{
 background:none;
 border:none;
 color:var(--text-faint);
 font-size:17.5px;
 font-weight:700;
 padding:11px 4px;
 margin-right:24px;
 cursor:pointer;
 position:relative;
 top:1px;
 }
 .tab.active{color:var(--paper);}
 .tab.active::after{
 content:'';
 position:absolute;
 left:0;right:0;bottom:-1px;
 height:2.5px;
 background:var(--accent);
 border-radius:2px;
 }
 .tab .count{
 color:var(--text-faint);
 font-weight:500;
 font-size:14.5px;
 }
 .panel{display:none;}
 .panel.active{display:block;}
 .empty-state{
 border:1.5px dashed var(--line-strong);
 border-radius:var(--radius-l);
 padding:44px 24px;
 text-align:center;
 color:var(--text-dim);
 }
 .empty-state h3{color:var(--paper); margin:0 0 9px; font-size:23px;}
 .empty-state p{margin:0 0 18px; font-size:16.5px; line-height:1.55;}
 .avail-toolbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:14px;
 margin-bottom:16px;
 flex-wrap:wrap;
 }
 .toolbar-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
 .mode-toggle{
 display:flex;
 background:var(--ink-2);
 border:1px solid var(--line);
 border-radius:999px;
 padding:3px;
 gap:2px;
 }
 .mode-toggle button{
 border:none;background:none;color:var(--text-dim);
 padding:8px 15px;border-radius:999px;font-size:15px;font-weight:700;
 cursor:pointer;
 }
 .mode-toggle button.active{background:var(--paper); color:var(--text-ink);}
 .legend{
 display:flex;gap:15px;align-items:center;flex-wrap:wrap;
 font-size:14.5px;color:var(--text-dim);
 font-weight:500;
 }
 .legend .item{display:flex;align-items:center;gap:7px;}
 .legend .sw{width:13px;height:13px;border-radius:4px;}
 .grid-scroll{
 overflow-x:auto;
 border:1px solid var(--line);
 border-radius:var(--radius-l);
 background:var(--ink-2);
 padding:15px;
 }
 .grid-wrap{
 display:grid;
 min-width:max-content;
 }
 .grid-corner{
 position:sticky; left:0; z-index:3;
 background:var(--ink-2);
 }
 .day-head{
 text-align:center;
 padding:6px 4px 11px;
 border-bottom:1px solid var(--line);
 font-size:14.5px;
 color:var(--text-dim);
 min-width:70px;
 }
 .day-head .dow{display:block; font-weight:700; color:var(--paper); font-size:15.5px;}
 .hour-label{
 font-size:13px;
 color:var(--text-faint);
 padding:0 10px 0 0;
 text-align:right;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 position:sticky; left:0;
 background:var(--ink-2);
 min-width:62px;
 }
 .cell{
 height:30px;
 margin:1.5px;
 border-radius:5px;
 background:rgba(255,255,255,0.035);
 border:1px solid rgba(255,255,255,0.05);
 cursor:pointer;
 position:relative;
 touch-action:none;
 }
 .cell:hover{border-color:var(--line-strong);}
 .cell.sched{
 outline:2px dashed rgba(251,247,240,0.55);
 outline-offset:-2px;
 }
 .cell.sched::after{
 content:'';
 position:absolute; top:2px; right:2px;
 width:5px;height:5px;border-radius:50%;
 background:var(--paper);
 }
 .cell.pending-select{
 outline:2px solid var(--accent);
 outline-offset:-2px;
 }
 .dates-section{margin-top:26px;}
 .dates-section-title{
 font-size:19px;
 color:var(--paper);
 margin:0 0 14px;
 }
 .period-group{margin-bottom:26px;}
 .period-group-head{
 display:flex;
 align-items:baseline;
 gap:10px;
 margin-bottom:11px;
 flex-wrap:wrap;
 }
 .period-group-head h3{
 color:var(--paper);
 font-size:19px;
 margin:0;
 }
 .period-group-head .meta{
 font-size:15px;
 color:var(--text-faint);
 }
 .dates-list, .ideas-list{
 display:flex;
 flex-direction:column;
 gap:12px;
 }
 .card{
 background:var(--paper);
 color:var(--text-ink);
 border-radius:var(--radius-l);
 padding:17px 19px;
 display:flex;
 justify-content:space-between;
 gap:16px;
 align-items:flex-start;
 flex-wrap:wrap;
 }
 .card .main{flex:1; min-width:220px;}
 .card .when{
 font-size:13.5px;
 text-transform:uppercase;
 letter-spacing:0.05em;
 color:var(--text-ink-dim);
 margin-bottom:5px;
 font-weight:700;
 }
 .card .title{
 font-size:22px;
 font-weight:700;
 margin:0 0 4px;
 }
 .card .notes{font-size:15.5px; color:var(--text-ink-dim); line-height:1.5; margin-top:5px;}
 .card .actions{display:flex; gap:8px; flex-wrap:wrap;}
 .card .actions .btn{
 color:var(--text-ink);
 border-color:rgba(34,40,59,0.2);
 }
 .card .actions .btn:hover{background:rgba(34,40,59,0.06);}
 .card .actions .btn-danger{color:var(--danger); border-color:rgba(226,99,122,0.4);}
 .pill{
 display:inline-block;
 font-size:13.5px;
 font-weight:700;
 padding:4px 11px;
 border-radius:999px;
 background:var(--paper-dim);
 color:var(--text-ink-dim);
 }
 .idea-tag{
 display:inline-flex; align-items:center; gap:6px;
 font-size:15px; color:var(--text-ink-dim); margin-top:7px;
 }
 .overlay{
 position:fixed; inset:0;
 background:rgba(10,12,24,0.6);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:50;
 }
 .overlay.show{display:flex;}
 .modal{
 background:var(--paper);
 color:var(--text-ink);
 border-radius:var(--radius-l);
 padding:28px 28px 24px;
 width:100%;
 max-width:440px;
 max-height:88vh;
 overflow-y:auto;
 }
 .modal h2{margin:0 0 5px; font-size:25px;}
 .modal .sub{font-size:15.5px; color:var(--text-ink-dim); margin:0 0 19px; line-height:1.5;}
 .field{margin-bottom:15px;}
 .field label{
 display:block; font-size:13.5px; font-weight:700;
 text-transform:uppercase; letter-spacing:0.05em;
 color:var(--text-ink-dim); margin-bottom:6px;
 }
 .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
 width:100%;
 border:1px solid rgba(34,40,59,0.18);
 border-radius:var(--radius-s);
 padding:10px 12px;
 font-size:16.5px;
 font-family:inherit;
 background:#ebe4dd;
 color:var(--text-ink);
 }
 .field textarea{resize:vertical; min-height:64px;}
 .field .hint-inline{font-size:13.5px; color:var(--text-ink-dim); margin-top:5px;}
 .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
 .identity-grid{display:flex; gap:12px; flex-wrap:wrap;}
 .identity-card{
 flex:1;
 min-width:120px;
 border:2px solid rgba(34,40,59,0.15);
 border-radius:var(--radius-m);
 padding:18px 12px;
 text-align:center;
 cursor:pointer;
 background:#fff;
 }
 .identity-card:hover{border-color:rgba(34,40,59,0.35);}
 .identity-card .sw{
 width:38px;height:38px;border-radius:50%;
 margin:0 auto 10px;
 }
 .identity-card .name{font-weight:700; font-size:18.5px;}
 .modal-actions{
 display:flex; justify-content:flex-end; gap:10px; margin-top:22px;
 }
 .modal-actions .btn{color:var(--text-ink); border-color:rgba(34,40,59,0.2);}
 .modal-actions .btn:hover{background:rgba(34,40,59,0.06);}
 .hint{font-size:13px; color:var(--text-dim); margin-top:-8px; margin-bottom:14px;}
 .date-preview{
 background:rgba(124,147,232,.10);
 border:1px solid rgba(124,147,232,.20);
 border-radius:12px;
 padding:12px 14px;
 margin:0 0 16px;
 line-height:1.5;
 }
 /* participant editor */
 .prow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
 .prow .swatch{width:15px;height:15px;border-radius:4px;flex:none;}
 .prow input{flex:1;}
 .prow input[type=color]{
 width:32px;height:32px;padding:2px;border:1px solid rgba(34,40,59,0.2);
 border-radius:6px;background:#fff;cursor:pointer;flex:none;
 }
 .prow .you-tag{font-size:13px;font-weight:700;color:var(--text-ink-dim);padding:0 4px;}
 .prow .premove{
 border:none;background:none;color:var(--text-ink-dim);
 font-size:22px;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px;
 }
 .prow .premove:hover{background:rgba(34,40,59,0.08);color:var(--danger);}
 .add-person{
 background:none;border:1.5px dashed rgba(34,40,59,0.25);
 color:var(--text-ink-dim);border-radius:var(--radius-s);
 padding:8px 12px;font-size:14.5px;font-weight:700;cursor:pointer;
 }
 .add-person:hover{border-color:var(--accent);color:var(--text-ink);}
 .share-link{
 display:flex;gap:8px;margin-top:6px;
 }
 .share-link input{
 flex:1;border:1px solid rgba(34,40,59,0.18);border-radius:var(--radius-s);
 padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text-ink);
 }
 .copied-note{font-size:13.5px;color:#3a8a5f;font-weight:700;margin-top:8px;min-height:18px;}
 @media (max-width:520px){
 .row-2{grid-template-columns:1fr;}
 .app-title{font-size:30px;}
 }
</style>
</head>
<body>
<div class="app">

 <div class="app-header">
 <h1 class="app-title">Save the Date</h1>
 <div class="who-am-i" id="whoAmI"></div>
 </div>

 <div class="periods-bar">
 <div class="label">Date periods</div>
 <div class="chip-row" id="periodsChipRow"></div>
 </div>

 <div class="tabs">
 <button class="tab active" data-tab="availability">Availability</button>
 <button class="tab" data-tab="ideas">Ideas <span class="count" id="ideasCount"></span></button>
 </div>

 <div class="panel active" id="panel-availability">
 <div id="availContent"></div>
 <div class="dates-section">
 <h3 class="dates-section-title">Your dates <span class="count" id="datesCount"></span></h3>
 <div id="datesContent"></div>
 </div>
 </div>

 <div class="panel" id="panel-ideas">
 <div class="avail-toolbar">
 <div></div>
 <button class="btn btn-accent btn-sm" id="addIdeaBtn">+ Add an idea</button>
 </div>
 <div id="ideasContent"></div>
 </div>

</div>

<div class="overlay" id="overlay">
 <div class="modal" id="modalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){

 /* ---------- persistence (localStorage) ---------- */
 var LS_STATE = 'savethedate-state-v2';
 var LS_ME = 'savethedate-me-v2';
 var LS_ACTIVE = 'savethedate-active-v2';

 var SUPABASE_URL = "https://rmrixqfiewmfhtobujhg.supabase.co";
 var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcml4cWZpZXdtZmh0b2J1amhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDg2ODksImV4cCI6MjEwNDY4NDY4OX0.2huDMfkhHoHfn_YD2Lb5omqv3RvZ1rE9G04MqP0sLdA";
 var sb = null;
 function initSupabase(){
 try{
 if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
 sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 }
 }catch(e){ console.error('Supabase init failed', e); sb = null; }
 }

 var PALETTE = ['#8B6FD9','#D8703A','#4FA6A0','#E2637A','#5B8DEF','#C9A227','#6BBF59','#D46FB0'];
 var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

 function emptyState(){ return { periods:[], ideas:[] }; }

 var state = emptyState();
 var me = null; // { name }
 var activePeriodId = null;
 var activeTab = 'availability';
 var mode = 'mark';
 var dragging = false;
 var dragValue = null;
 var scheduleDrag = null;

 function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
 function parseDate(str){ var p = str.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
 function fmtDate(str){ var d = parseDate(str); return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); }
 function fmtDateShort(str){ var d = parseDate(str); return MON[d.getMonth()] + ' ' + d.getDate(); }
 function fmtHour(h){ var period = h < 12 ? 'AM' : 'PM'; var hr = h % 12; if(hr===0) hr = 12; return hr + period; }
 function fmtHourRange(h1,h2){ return fmtHour(h1) + ' – ' + fmtHour(h2); }
 function formatDateTimeLabel(date, startHour, endHour){
 var d = parseDate(date);
 return MON[d.getMonth()] + ' ' + d.getDate() + ' · ' + fmtHour(startHour) + '–' + fmtHour(endHour);
 }
 function enumerateDates(startStr, endStr){
 var out = [], d = parseDate(startStr), end = parseDate(endStr);
 while(d <= end){
 var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 out.push(y+'-'+m+'-'+day);
 d.setDate(d.getDate()+1);
 }
 return out;
 }
 function hoursArray(startHour, endHour){ var out = []; for(var h=startHour; h<endHour; h++) out.push(h); return out; }
 function slotKey(date,hour){ return date+'_'+hour; }
 function hexToRgb(hex){ hex = hex.replace('#',''); return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)]; }
 function blendColors(colors){
 var r=0,g=0,b=0;
 colors.forEach(function(c){ var rgb=hexToRgb(c); r+=rgb[0]; g+=rgb[1]; b+=rgb[2]; });
 var n=colors.length||1;
 return 'rgb('+Math.round(r/n)+','+Math.round(g/n)+','+Math.round(b/n)+')';
 }
 function escapeHtml(s){
 return (s||'').replace(/[&<>"']/g, function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
 });
 }
 function getPeriod(id){ return state.periods.find(function(p){ return p.id === id; }) || null; }
 function activePeriod(){ return getPeriod(activePeriodId); }
 function normalizeLoc(s){ return (s||'').trim().toLowerCase(); }

 /* color of a participant within a period (by position, so it is stable) */
 function participantColor(period, name){
 if(period.colors && period.colors[name]) return period.colors[name];
 var i = (period.participants||[]).indexOf(name);
 if(i < 0) i = 0;
 return PALETTE[i % PALETTE.length];
 }
 function everyoneColor(period){
 return blendColors((period.participants||[]).map(function(n){ return participantColor(period, n); }));
 }

 function load(){
 try{ me = JSON.parse(localStorage.getItem(LS_ME)) || null; }catch(e){ me = null; }
 try{ state = JSON.parse(localStorage.getItem(LS_STATE)) || emptyState(); }catch(e){ state = emptyState(); }
 try{ activePeriodId = JSON.parse(localStorage.getItem(LS_ACTIVE)) || null; }catch(e){ activePeriodId = null; }
 normalizeState();
 }
 function save(){
 try{
 localStorage.setItem(LS_STATE, JSON.stringify(state));
 localStorage.setItem(LS_ME, JSON.stringify(me));
 localStorage.setItem(LS_ACTIVE, JSON.stringify(activePeriodId));
 }catch(e){ console.error('save failed', e); }
 }
 function normalizeState(){
 state.periods = state.periods || [];
 state.ideas = state.ideas || [];
 state.periods.forEach(function(p){
 p.participants = p.participants || [];
 p.availability = p.availability || {};
 p.dates = p.dates || [];
 p.colors = p.colors || {};
 });
 if(!getPeriod(activePeriodId) && state.periods.length){
 activePeriodId = state.periods[0].id;
 }
 }

 /* cross-tab sync: reload when another tab of the same browser saves */
 window.addEventListener('storage', function(e){
 if(e.key === LS_STATE || e.key === LS_ME || e.key === LS_ACTIVE){
 if(dragging) return;
 load();
 renderAll();
 }
 });

 function mergeArrayUnique(a, b){

 });
 var existing = getPeriod(incoming.id);
 if(existing){
 // keep local details, union participants / availability / dates
 existing.participants = mergeArrayUnique(existing.participants, incoming.participants);
 existing.colors = Object.assign({}, incoming.colors || {}, existing.colors || {});
 Object.keys(incoming.availability || {}).forEach(function(name){
 existing.availability[name] = mergeArrayUnique(existing.availability[name] || [], incoming.availability[name]);
 });
 var haveDate = {};
 existing.dates.forEach(function(d){ haveDate[d.id] = 1; });
 (incoming.dates || []).forEach(function(d){ if(!haveDate[d.id]) existing.dates.push(d); });
 // refresh trip details from the newer copy
 existing.name = incoming.name; existing.location = incoming.location;
 existing.startDate = incoming.startDate; existing.endDate = incoming.endDate;
 existing.startHour = incoming.startHour; existing.endHour = incoming.endHour;
 activePeriodId = existing.id;
 } else {
 incoming.availability = incoming.availability || {};
 incoming.dates = incoming.dates || [];
 incoming.myName = null; // recipient hasn't picked yet

 var cloud = res && res.data && res.data.data;

 var metaId = cloud.id || roomId;
 var p = state.periods.find(function(x){ return x.id === metaId || x.roomId === roomId; });
 if(!p){

 if(!scheduleDrag) return;
 for(var h=scheduleDrag.minHour; h<scheduleDrag.maxHour; h++){
 var sel = document.querySelector('.cell[data-day="'+scheduleDrag.date+'"][data-hour="'+h+'"]');
 if(sel) sel.classList.add('pending-select');
 }
 }
 function handleDraggedCell(period, cell){
 if(!cell || !dragging || mode !== 'schedule' || !scheduleDrag) return;
 var date = cell.getAttribute('data-day');
 var hour = parseInt(cell.getAttribute('data-hour'), 10);
 if(date !== scheduleDrag.date) return;
 var min = Math.min(scheduleDrag.startHour, hour);
 var max = Math.max(scheduleDrag.startHour, hour) + 1;
 scheduleDrag.minHour = min; scheduleDrag.maxHour = max;
 paintScheduleSelection(period);
 }
 function attachGridHandlers(){
 var period = activePeriod();
 document.querySelectorAll('.cell').forEach(function(cell){
 cell.addEventListener('pointerdown', function(e){
 e.preventDefault();
 var date = cell.getAttribute('data-day');
 var hour = parseInt(cell.getAttribute('data-hour'), 10);

 if(mode === 'mark'){
 if(!period.myName){ showPickIdentityModal(period, function(){}); return; }
 dragging = true;
 var key = slotKey(date, hour);
 var isSet = (period.availability[period.myName] || []).indexOf(key) !== -1;
 dragValue = !isSet;
 toggleAvailability(period, date, hour, dragValue);
 paintCell(period, date, hour);
 return;
 }
 dragging = true;
 scheduleDrag = { date:date, startHour:hour, minHour:hour, maxHour:hour+1 };
 paintScheduleSelection(period);
 });
 });
 }

 document.addEventListener('pointermove', function(e){
 if(!dragging) return;
 var period = activePeriod();
 if(!period) return;
 if(mode === 'mark'){
 var cell = getCellAtPoint(e.clientX, e.clientY);
 if(!cell || !period.myName) return;
 var date = cell.getAttribute('data-day');
 var hour = parseInt(cell.getAttribute('data-hour'), 10);
 var arr = period.availability[period.myName] || [];
 var isSet = arr.indexOf(slotKey(date,hour)) !== -1;
 if(isSet === dragValue) return;
 toggleAvailability(period, date, hour, dragValue);
 paintCell(period, date, hour);
 return;
 }
 handleDraggedCell(period, getCellAtPoint(e.clientX, e.clientY));
 });
 function onPointerUp(){
 if(!dragging) return;
 dragging = false;
 var period = activePeriod();
 if(mode === 'mark'){ save(); syncMyAvailability(period); return; }
 if(mode === 'schedule' && scheduleDrag){
 var sd = scheduleDrag; scheduleDrag = null;
 document.querySelectorAll('.cell.pending-select').forEach(function(c){ c.classList.remove('pending-select'); });
 showDateModal(period, null, { date: sd.date, startHour: sd.minHour, endHour: sd.maxHour });
 }
 }
 document.addEventListener('pointerup', onPointerUp);
 document.addEventListener('pointercancel', onPointerUp);

 /* ---------- date modal ---------- */
 function showDateModal(period, existing, prefill){
 if(!period){ alert('Pick a period first.'); return; }
 var d = existing || prefill || { date:'', startHour:9, endHour:10, title:'', notes:'', ideaIds:[] };
 var chosen = d.ideaIds || (d.ideaId ? [d.ideaId] : []);

 var ideaOptions = '';
 state.ideas.filter(function(idea){
 var free = !idea.dateId || idea.dateId === (existing ? existing.id : null);
 var locOk = true;
 return free && locOk;
 }).forEach(function(idea){
 var selected = chosen.indexOf(idea.id) !== -1 ? ' selected' : '';
 ideaOptions += '<option value="'+idea.id+'"'+selected+'>'+escapeHtml(idea.title)+
 (idea.location ? ' (📍 '+escapeHtml(idea.location)+')' : '')+'</option>';
 });

 var customTitle = chosen.length ? '' : (d.title || '');
 var previewHtml = '<div class="date-preview"><strong>'+
 escapeHtml(formatDateTimeLabel(d.date, d.startHour, d.endHour))+
 '</strong><div>'+escapeHtml(period.name)+'</div></div>';

 openModal(
 '<h2>'+(existing?'Edit date':'What is this date for?')+'</h2>'+
 (existing?'':'<p class="sub">Pick something from your date ideas, or make up your own.</p>')+
 previewHtml+
 '<div class="field"><label>Date ideas <span style="font-weight:400;opacity:.6">(pick one or more — Ctrl/Cmd-click)</span></label><select id="dateIdea" multiple size="4">'+ideaOptions+'</select></div>'+
 '<div class="field"><label>Or make your own</label><input type="text" id="dateCustomTitle" placeholder="" value="'+escapeHtml(customTitle)+'"></div>'+
 '<div class="field"><label>Notes <span style="font-weight:400;opacity:.6">(optional)</span></label><textarea id="dateNotes" placeholder="">'+escapeHtml(d.notes||'')+'</textarea></div>'+
 '<div class="modal-actions">'+
 (existing?'<button class="btn btn-danger" id="deleteDateBtn" style="margin-right:auto">Remove</button>':'')+
 '<button class="btn" id="cancelDateBtn">Cancel</button>'+
 '<button class="btn btn-accent" id="saveDateBtn">'+(existing?'Save changes':'Make it a date')+'</button>'+
 '</div>'
 );

 document.getElementById('cancelDateBtn').addEventListener('click', closeModal);
 var ideaSelect = document.getElementById('dateIdea');
 var customInput = document.getElementById('dateCustomTitle');
 function selectedIdeaIds(){ return Array.prototype.map.call(ideaSelect.selectedOptions, function(o){ return o.value; }); }
 ideaSelect.addEventListener('change', function(){ if(selectedIdeaIds().length) customInput.value = ''; });
 customInput.addEventListener('input', function(){ if(customInput.value.trim()){ Array.prototype.forEach.call(ideaSelect.options, function(o){ o.selected = false; }); } });

 if(existing){
 document.getElementById('deleteDateBtn').addEventListener('click', function(){
 period.dates = period.dates.filter(function(x){ return x.id !== existing.id; });
 state.ideas.forEach(function(idea){ if(idea.dateId === existing.id) idea.dateId = null; });
 save(); writeAll(period); closeModal(); renderAll();
 });
 }

 document.getElementById('saveDateBtn').addEventListener('click', function(){
 var ideaIds = selectedIdeaIds();
 var customTitleValue = customInput.value.trim();
 if(!ideaIds.length && !customTitleValue){ alert('Choose a date idea or describe what the date is for.'); return; }
 var id = existing ? existing.id : uid();
 // unlink ideas that were on this date but are no longer selected
 state.ideas.forEach(function(idea){ if(idea.dateId === id && ideaIds.indexOf(idea.id) === -1) idea.dateId = null; });
 // link every selected idea to this date
 ideaIds.forEach(function(iid){ var idea = state.ideas.find(function(i){ return i.id === iid; }); if(idea) idea.dateId = id; });
 var record = {
 id:id, date:d.date, startHour:d.startHour, endHour:d.endHour,
 title: ideaIds.length ? '' : customTitleValue,
 notes: document.getElementById('dateNotes').value.trim(),
 ideaIds: ideaIds
 };
 if(existing){
 var index = period.dates.findIndex(function(x){ return x.id === existing.id; });
 period.dates[index] = record;
 } else {
 period.dates.push(record);
 }
 save(); writeAll(period); closeModal(); renderAll();
 });
 }

 /* ---------- dates list ---------- */
 function renderDates(){
 var el = document.getElementById('datesContent');
 var total = state.periods.reduce(function(n,p){ return n + p.dates.length; }, 0);
 document.getElementById('datesCount').textContent = total ? '('+total+')' : '';
 if(!total){
 el.innerHTML = '<div class="empty-state">'+
 '<h3>Nothing on the calendar yet</h3>'+
 '<p>Switch to “Turn into a date,” then drag across a stretch of time we\'re both free.</p>'+
 '</div>';
 return;
 }
 var periodsWithDates = state.periods.filter(function(p){ return p.dates.length; })
 .sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });
 el.innerHTML = periodsWithDates.map(function(period){
 var items = period.dates.slice().sort(function(a,b){
 return (a.date+String(a.startHour).padStart(2,'0')).localeCompare(b.date+String(b.startHour).padStart(2,'0'));
 });
 var headHtml = '<div class="period-group-head"><h3>'+escapeHtml(period.name)+'</h3><span class="meta">'+
 (period.location?escapeHtml(period.location)+' · ':'')+fmtDateShort(period.startDate)+'–'+fmtDateShort(period.endDate)+'</span></div>';
 var cardsHtml = items.map(function(d){
 var ideaIds = d.ideaIds || (d.ideaId ? [d.ideaId] : []);
 var ideaTitles = ideaIds.map(function(iid){ var i = state.ideas.find(function(x){ return x.id===iid; }); return i ? i.title : null; }).filter(Boolean);
 var displayTitle = d.title || (ideaTitles.length ? ideaTitles.join(' + ') : 'Open plan');
 return '<div class="card">'+
 '<div class="main">'+
 '<div class="when">'+fmtDate(d.date)+' · '+fmtHourRange(d.startHour,d.endHour)+'</div>'+
 '<div class="title">'+escapeHtml(displayTitle)+'</div>'+
 (d.title && ideaTitles.length ? '<div class="idea-tag">💡 '+escapeHtml(ideaTitles.join(', '))+'</div>' : '')+
 (d.notes ? '<div class="notes">'+escapeHtml(d.notes)+'</div>' : '')+
 '</div>'+
 '<div class="actions"><button class="btn btn-sm edit-date" data-pid="'+period.id+'" data-id="'+d.id+'">Edit</button></div>'+
 '</div>';
 }).join('');
 return '<div class="period-group">'+headHtml+'<div class="dates-list">'+cardsHtml+'</div></div>';
 }).join('');
 el.querySelectorAll('.edit-date').forEach(function(btn){
 btn.addEventListener('click', function(){
 var period = getPeriod(btn.getAttribute('data-pid'));
 var d = period.dates.find(function(x){ return x.id === btn.getAttribute('data-id'); });
 showDateModal(period, d, null);
 });
 });
 }

 /* ---------- ideas ---------- */
 function showIdeaModal(existing){
 var i = existing || { title:'', description:'', location:'' };
 var locs = collectKnownLocations();
 openModal(
 '<h2>'+(existing?'Edit idea':'Add a date idea')+'</h2>'+
 '<div class="field"><label>Title</label><input type="text" id="ideaTitle" placeholder="" value="'+escapeHtml(i.title)+'"></div>'+
 '<div class="field"><label>City (optional)</label><input type="text" id="ideaLocation" placeholder="" list="ideaLocs" value="'+escapeHtml(i.location||'')+'">'+
 '<datalist id="ideaLocs">'+locs.map(function(l){ return '<option value="'+escapeHtml(l)+'">'; }).join('')+'</datalist>'+
 '<div class="hint-inline"></div>'+
 '</div>'+
 '<div class="field"><label>Notes (optional)</label><textarea id="ideaDesc" placeholder="">'+escapeHtml(i.description||'')+'</textarea></div>'+
 '<div class="modal-actions">'+
 (existing?'<button class="btn btn-danger" id="deleteIdeaBtn" style="margin-right:auto">Remove</button>':'')+
 '<button class="btn" id="cancelIdeaBtn">Cancel</button>'+
 '<button class="btn btn-accent" id="saveIdeaBtn">Save</button>'+
 '</div>'
 );
 document.getElementById('cancelIdeaBtn').addEventListener('click', closeModal);
 if(existing){
 document.getElementById('deleteIdeaBtn').addEventListener('click', function(){
 state.ideas = state.ideas.filter(function(x){ return x.id !== existing.id; });
 save(); syncAllRooms(); closeModal(); renderAll();
 });
 }
 document.getElementById('saveIdeaBtn').addEventListener('click', function(){
 var title = document.getElementById('ideaTitle').value.trim();
 var location = document.getElementById('ideaLocation').value.trim();
 var desc = document.getElementById('ideaDesc').value.trim();
 if(!title){ alert('Give the idea a title.'); return; }
 if(existing){ existing.title = title; existing.description = desc; existing.location = location; }
 else { state.ideas.push({ id:uid(), title:title, description:desc, location:location, dateId:null }); }
 save(); syncAllRooms(); closeModal(); renderAll();
 });
 }
 function findDate(dateId){
 for(var i=0;i<state.periods.length;i++){
 var d = state.periods[i].dates.find(function(x){ return x.id === dateId; });
 if(d) return { period: state.periods[i], date: d };
 }
 return null;
 }
 function showAssignModal(idea){
 var open = [];
 state.periods.forEach(function(p){
 if(idea.location && normalizeLoc(p.location) !== normalizeLoc(idea.location)) return;
 p.dates.forEach(function(d){ var ids = d.ideaIds || (d.ideaId ? [d.ideaId] : []); if(ids.indexOf(idea.id) === -1) open.push({ period:p, date:d }); });
 });
 if(!open.length){
 openModal('<h2>No matching open dates</h2><p class="sub">'+(idea.location ? 'There is no open date in '+escapeHtml(idea.location)+' yet.' : 'Every date already has a plan, or there are no dates yet.')+' Drag a stretch of shared free time in Availability to create one.</p><div class="modal-actions"><button class="btn btn-accent" id="okBtn">Got it</button></div>');
 document.getElementById('okBtn').addEventListener('click', closeModal);
 return;
 }
 var options = open.map(function(o){
 return '<option value="'+o.date.id+'">'+fmtDate(o.date.date)+' · '+fmtHourRange(o.date.startHour,o.date.endHour)+' · '+escapeHtml(o.period.name)+'</option>';
 }).join('');
 openModal(
 '<h2>Assign “'+escapeHtml(idea.title)+'”</h2>'+
 '<div class="field"><label>To which date?</label><select id="assignSelect">'+options+'</select></div>'+
 '<div class="modal-actions"><button class="btn" id="cancelAssign">Cancel</button><button class="btn btn-accent" id="confirmAssign">Assign</button></div>'
 );
 document.getElementById('cancelAssign').addEventListener('click', closeModal);
 document.getElementById('confirmAssign').addEventListener('click', function(){
 var dateId = document.getElementById('assignSelect').value;
 idea.dateId = dateId;
 var found = findDate(dateId);
 if(found){
 found.date.ideaIds = found.date.ideaIds || (found.date.ideaId ? [found.date.ideaId] : []);
 if(found.date.ideaIds.indexOf(idea.id) === -1) found.date.ideaIds.push(idea.id);
 }
 save(); if(found) writeAll(found.period); closeModal(); renderAll();
 });
 }
 function renderIdeas(){
 var el = document.getElementById('ideasContent');
 document.getElementById('ideasCount').textContent = state.ideas.length ? '('+state.ideas.length+')' : '';
 if(!state.ideas.length){
 el.innerHTML = '<div class="empty-state">'+
 '<h3>No ideas yet</h3>'+
 '<p>A running list of things to do together. Can pull into scheduled dates!</p>'+
 '</div>';
 return;
 }
 el.innerHTML = '<div class="ideas-list">' + state.ideas.map(function(idea){
 var found = idea.dateId ? findDate(idea.dateId) : null;
 var linkedDate = found ? found.date : null;
 return '<div class="card">'+
 '<div class="main">'+
 '<div style="display:flex; gap:6px; flex-wrap:wrap;">'+
 (linkedDate ? '<span class="pill">'+fmtDate(linkedDate.date)+' · '+fmtHourRange(linkedDate.startHour,linkedDate.endHour)+'</span>' : '<span class="pill">Not scheduled</span>')+
 '<span class="pill">'+(idea.location ? '📍 '+escapeHtml(idea.location) : 'Works anywhere')+'</span>'+
 '</div>'+
 '<div class="title" style="margin-top:9px;">'+escapeHtml(idea.title)+'</div>'+
 (idea.description ? '<div class="notes">'+escapeHtml(idea.description)+'</div>' : '')+
 '</div>'+
 '<div class="actions">'+
 (linkedDate ? '' : '<button class="btn btn-sm assign-idea" data-id="'+idea.id+'">Assign to a date</button>')+
 '<button class="btn btn-sm edit-idea" data-id="'+idea.id+'">Edit</button>'+
 '</div>'+
 '</div>';
 }).join('') + '</div>';
 el.querySelectorAll('.edit-idea').forEach(function(btn){
 btn.addEventListener('click', function(){ showIdeaModal(state.ideas.find(function(x){ return x.id === btn.getAttribute('data-id'); })); });
 });
 el.querySelectorAll('.assign-idea').forEach(function(btn){
 btn.addEventListener('click', function(){ showAssignModal(state.ideas.find(function(x){ return x.id === btn.getAttribute('data-id'); })); });
 });
 }

 /* ---------- header / tabs ---------- */
 function renderHeader(){
 var el = document.getElementById('whoAmI');
 if(!me){ el.innerHTML=''; return; }
 el.innerHTML = '<span class="swatch" style="background:'+PALETTE[0]+'"></span>'+escapeHtml(me.name)+'<button id="switchMeBtn">change name</button>';
 document.getElementById('switchMeBtn').addEventListener('click', showNameModal);
 }
 function renderTabs(){
 document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-tab') === activeTab); });
 document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('active', p.id === 'panel-'+activeTab); });
 }
 function renderAll(){
 renderHeader();
 renderPeriodsBar();
 renderTabs();
 renderAvailability();
 renderDates();
 renderIdeas();
 }

 document.querySelectorAll('.tab').forEach(function(tab){
 tab.addEventListener('click', function(){ activeTab = tab.getAttribute('data-tab'); renderAll(); });
 });
 document.getElementById('addIdeaBtn').addEventListener('click', function(){ showIdeaModal(null); });

 /* ---------- init ---------- */
 (function init(){
 initSupabase();
 load();
 subscribeAllRooms(); // resume live sync for periods already shared
 var imported = handleShareHash(); // if opened from a share link, import/join it
 if(!me && !imported){ showNameModal(); }
 renderAll();
 })();

})();
</script>
